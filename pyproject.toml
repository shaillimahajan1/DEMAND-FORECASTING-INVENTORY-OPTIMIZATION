[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting-inventory-optimization"
version = "1.0.0"
description = "End-to-End Demand Forecasting, Inventory Planning & Operational Decision Intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Shailli Mahajan"}
]
keywords = [
    "demand-forecasting",
    "inventory-optimization",
    "safety-stock",
    "reorder-point",
    "supply-chain-analytics",
    "lightgbm",
    "duckdb",
    "power-bi",
    "time-series-backtesting"
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "lightgbm>=4.3.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests",
]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
