# Operational Inventory Assumptions & Policy Configuration
# CRITICAL NOTICE:
# The parameters below represent business assumptions, service level policies,
# and scenario inputs used for inventory optimization modeling.
# They are not observed physical phenomena from historical transaction logs.

inventory_policy:
  default_service_level: 0.95
  default_lead_time_days: 7
  default_lead_time_std_days: 1.5
  review_period_days: 7
  annual_holding_cost_rate: 0.25 # 25% of unit cost per year
  daily_holding_cost_rate: 0.000685 # 0.25 / 365
  stockout_penalty_multiplier: 2.0 # Multiple of gross margin lost
  order_cost_fixed: 50.0 # Fixed procurement ordering cost per PO

z_factor_lookup:
  0.85: 1.0364
  0.90: 1.2816
  0.95: 1.6449
  0.975: 1.9600
  0.98: 2.0537
  0.99: 2.3263
  0.999: 3.0902

safety_stock_model:
  method: "combined_uncertainty" # Z * sqrt(L * sigma_D^2 + D_bar^2 * sigma_L^2)
  fallback_method: "demand_uncertainty_only" # Z * sigma_D * sqrt(L)

risk_classification:
  stockout_risk:
    critical_threshold_days_supply: 3.0
    high_threshold_days_supply: 7.0
    medium_threshold_days_supply: 14.0
    # Over 14 days of supply = Low Risk
  excess_inventory:
    excess_threshold_days_supply: 45.0
    dead_stock_zero_sales_days: 60

abc_classification:
  a_threshold_pct: 0.70 # Top 70% of total revenue
  b_threshold_pct: 0.90 # Next 20% of revenue (70% - 90%)
  c_threshold_pct: 1.00 # Remaining 10% of revenue

xyz_classification:
  x_threshold_cv: 0.50 # CV < 0.50: Steady, highly predictable
  y_threshold_cv: 1.00 # 0.50 <= CV < 1.00: Moderate variability
  z_threshold_cv: 99.9 # CV >= 1.00: Highly erratic or intermittent

scenarios:
  baseline:
    name: "Baseline Current State"
    demand_multiplier: 1.00
    lead_time_multiplier: 1.00
    service_level: 0.95
    volatility_multiplier: 1.00
  demand_surge:
    name: "Demand Surge (+15%)"
    demand_multiplier: 1.15
    lead_time_multiplier: 1.00
    service_level: 0.95
    volatility_multiplier: 1.00
  lead_time_disruption:
    name: "Supply Chain Disruption (Lead Time +20%)"
    demand_multiplier: 1.00
    lead_time_multiplier: 1.20
    service_level: 0.95
    volatility_multiplier: 1.00
  service_level_elevation:
    name: "Premium Service Target (Service Level 99%)"
    demand_multiplier: 1.00
    lead_time_multiplier: 1.00
    service_level: 0.99
    volatility_multiplier: 1.00
  volatility_shock:
    name: "Market Volatility Shock (CV +30%)"
    demand_multiplier: 1.00
    lead_time_multiplier: 1.00
    service_level: 0.95
    volatility_multiplier: 1.30
  compound_stress:
    name: "Compound Stress Test (Demand +15%, Lead Time +20%, Service Level 98%)"
    demand_multiplier: 1.15
    lead_time_multiplier: 1.20
    service_level: 0.98
    volatility_multiplier: 1.15
